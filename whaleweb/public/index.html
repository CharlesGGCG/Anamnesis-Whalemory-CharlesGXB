<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小鲸鱼 · 鲸忆</title>
<style>
  :root {
    --accent: #d97757;
    --accent-hover: #c46343;
    --accent-tint: #f6ded7;
    --canvas: #ffffff;
    --sidebar: #fafafa;
    --bubble-her: #f4f2f3;
    --bubble-me: #d97757;
    --ink: #161616;
    --ink-2: #70686a;
    --ink-3: #91888a;
    --border: #e9e9e9;
    --border-2: #dedede;
    --divider: rgba(22,22,22,0.05);
    --hover: rgba(6,6,6,0.08);
    --code-bg: rgba(6,6,6,0.05);
    --link: #184f95;
    --on-accent: #ffffff;
    --shadow: 0 4px 18px rgba(20,20,19,0.10), 0 1px 3px rgba(20,20,19,0.05);
    --danger: #b3261e;
  }
  html[data-theme="dark"] {
    --accent-hover: #eb9170;
    --accent-tint: #48261b;
    --canvas: #191919;
    --sidebar: #1f1f1f;
    --bubble-her: rgba(255,255,255,0.06);
    --bubble-me: #d97757;
    --ink: #fdfdfd;
    --ink-2: #beb6b8;
    --ink-3: #9c9395;
    --border: rgba(255,255,255,0.09);
    --border-2: rgba(255,255,255,0.18);
    --divider: rgba(255,255,255,0.06);
    --hover: rgba(255,255,255,0.08);
    --code-bg: rgba(255,255,255,0.05);
    --link: #8ab4f8;
    --on-accent: #fbfbfb;
    --shadow: 0 4px 16px rgba(0,0,0,0.30), 0 1px 3px rgba(0,0,0,0.14);
    --danger: #f2b8b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, .serif { font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif; font-weight: 600; letter-spacing: .01em; }
  .hidden { display: none !important; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* —— 邀请门 —— */
  .gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--canvas); z-index: 100; padding: 24px; }
  .gate-card {
    background: var(--sidebar); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 40px 32px; text-align: center; width: 100%; max-width: 400px;
  }
  .gate .avatar { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%; }
  .gate h1 { font-size: 26px; }
  .gate-sub { color: var(--ink-2); margin: 8px 0 24px; font-size: 14px; }
  .gate input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; background: var(--canvas); color: var(--ink); text-align: center; outline: none;
  }
  .gate input:focus { border-color: var(--accent); }
  .gate button {
    width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); font-size: 15px; cursor: pointer; transition: background .15s;
  }
  .gate button:hover { background: var(--accent-hover); }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* —— 三栏布局（两侧可拖拽调宽）—— */
  /* 固定 5 条网格轨道：左栏 | 拖条 | 中间 | 拖条 | 右栏；访客时右两条塌成 0。 */
  .app { display: grid; grid-template-columns: var(--left-w, 280px) 6px minmax(0,1fr) 0px 0px; height: 100vh; }
  .app.dev { grid-template-columns: var(--left-w, 280px) 6px minmax(0,1fr) 6px var(--right-w, 340px); }
  #left { grid-column: 1; }
  #resizer-left { grid-column: 2; }
  .center { grid-column: 3; }
  #resizer-right { grid-column: 4; }
  #right { grid-column: 5; }
  .resizer {
    width: 100%; cursor: col-resize; background: transparent;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .resizer::after {
    content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    width: 2px; height: 40px; border-radius: 1px; background: var(--border-2);
    transition: background .15s, height .15s;
  }
  .resizer:hover { background: var(--hover); }
  .resizer:hover::after, .resizer.active::after { background: var(--accent); height: 56px; }
  .panel {
    background: var(--sidebar); border-right: 1px solid var(--border); overflow-y: auto;
    display: flex; flex-direction: column; font-size: 13px; min-width: 0; min-height: 0;
  }
  .panel.right { border-right: none; border-left: 1px solid var(--border); background: var(--sidebar); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid var(--divider); font-weight: 600; color: var(--ink-2); font-size: 13px;
    position: sticky; top: 0; background: var(--sidebar); z-index: 2;
  }
  .panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 18px; }
  .panel-sec h4 { font-size: 12px; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; letter-spacing: .02em; }
  .panel-sec .empty { color: var(--ink-3); font-size: 12.5px; }

  /* 左栏：她在看 */
  .watch-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--divider); }
  .watch-item:last-child { border-bottom: none; }
  .watch-thumb { width: 56px; height: 36px; border-radius: 6px; background: var(--hover); flex-shrink: 0; overflow: hidden; object-fit: cover; }
  .watch-meta { min-width: 0; flex: 1; }
  .watch-title { font-size: 13px; line-height: 1.4; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .watch-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .watch-tag { font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  #watch-form { display: flex; gap: 8px; }
  #watch-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); color: var(--ink); font-size: 13px; outline: none; }
  #watch-input:focus { border-color: var(--accent); }
  #watch-add { padding: 8px 12px; border: none; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 13px; cursor: pointer; }
  #watch-add:hover { background: var(--accent-hover); }

  /* 进程状态 */
  .proc-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--divider); }
  .proc-row:last-child { border-bottom: none; }
  .proc-row .k { color: var(--ink-2); }
  .proc-row .v { color: var(--ink); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #b8b2a7; display: inline-block; }
  .dot.on { background: #5fa87a; }
  .dot.thinking { background: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* 中间：聊天 */
  .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; background: var(--canvas); }
  header {
    display: flex; align-items: center; gap: 14px; padding: 16px 22px;
    border-bottom: 1px solid var(--divider); background: var(--canvas); flex-shrink: 0;
  }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--accent-tint); border: 1px solid var(--border); transition: transform .2s ease; }
  .avatar.thinking { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  header h1 { font-size: 19px; }
  .status { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; flex-shrink: 0; border: 1px solid var(--border); background: transparent;
    border-radius: 10px; font-size: 16px; cursor: pointer; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; padding: 0; transition: background .15s, border-color .15s;
  }
  .icon-btn:hover { border-color: var(--accent); background: var(--hover); }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .thread { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }
  .row .avatar { width: 30px; height: 30px; }
  .bubble {
    max-width: 76%; padding: 11px 15px; border-radius: 16px; line-height: 1.6; font-size: 15px;
    white-space: pre-wrap; word-break: break-word; animation: rise .3s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row.her .bubble { background: var(--bubble-her); border-bottom-left-radius: 6px; }
  .row.me .bubble { background: var(--bubble-me); color: var(--on-accent); border-bottom-right-radius: 6px; }
  .bubble .retry { display: inline-block; margin-top: 8px; padding: 4px 12px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); font-size: 13px; cursor: pointer; }
  .bubble .retry:hover { background: var(--accent-tint); }
  .typing { color: var(--ink-3); font-size: 13.5px; padding: 2px 4px; }
  .typing .dots::after { content: '…'; animation: blink 1.2s infinite; }
  .bubble.img { padding: 4px; }
  .bubble.img img { max-width: 180px; max-height: 180px; border-radius: 10px; display: block; }
  .bubble .her-sticker { max-width: 150px; max-height: 150px; border-radius: 10px; display: block; margin-bottom: 6px; }

  footer {
    padding: 12px 22px 16px; background: var(--canvas); border-top: 1px solid var(--divider);
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
  }
  footer .inner { width: 100%; max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    font-size: 15px; font-family: inherit; color: var(--ink); background: var(--canvas); outline: none;
    max-height: 140px; line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }
  footer button.send {
    border: none; background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 12px 20px;
    font-size: 15px; cursor: pointer; transition: background .15s; flex-shrink: 0;
  }
  footer button.send:hover { background: var(--accent-hover); }
  footer button.send:disabled { background: var(--hover); color: var(--ink-3); cursor: default; }

  .sticker-btn { width: 40px; height: 40px; flex-shrink: 0; }
  .sticker-panel {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    width: min(560px, calc(100% - 32px)); max-height: 340px; overflow-y: auto;
    background: var(--canvas); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 14px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; z-index: 10;
  }
  .sticker-panel .st { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; cursor: pointer; background: var(--hover); }
  .sticker-panel .st:hover { background: var(--accent-tint); outline: 2px solid var(--accent); }

  /* 右栏：思考后台 */
  .dev-body { font-size: 12px; line-height: 1.6; padding: 12px 16px 20px; }
  .dev-kv { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 4px; }
  .dev-kv span { color: #5fa87a; }
  html[data-theme="dark"] .dev-kv span { color: #8cbf96; }
  .dev-body h4 { color: var(--accent); margin: 12px 0 4px; font-size: 12px; font-weight: 600; }
  .dev-body pre {
    white-space: pre-wrap; word-break: break-word; margin: 0; color: var(--ink-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    background: var(--code-bg); border: 1px solid var(--divider); border-radius: 8px; padding: 8px 10px;
  }
  .dev-empty { color: var(--ink-3); font-size: 12.5px; padding: 12px 16px; }

  @media (max-width: 1000px) {
    .app, .app.dev { grid-template-columns: 1fr; }
    .panel.left, .panel.right, .resizer { display: none; }
  }
</style>
</head>
<body>

  <!-- 邀请门 -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <img class="avatar" src="/avatar.png" alt="🐋">
      <h1>小鲸鱼</h1>
      <p class="gate-sub">她住在这台电脑里，等你来。</p>
      <input id="invite" placeholder="邀请码" autocomplete="off">
      <button id="enter">进来</button>
      <div class="err" id="gate-err"></div>
    </div>
  </div>

  <!-- 三栏 -->
  <div id="app" class="app hidden">
    <!-- 左栏：她在看 / 进程 -->
    <aside id="left" class="panel left">
      <div class="panel-head"><span>🐋 她的活动</span></div>
      <div class="panel-body">
        <div class="panel-sec" id="watch-queue-sec">
          <h4>待看队列</h4>
          <div id="watch-queue"></div>
          <div id="watch-form-wrap" style="margin-top:8px"></div>
        </div>
        <div class="panel-sec">
          <h4>最近看的</h4>
          <div id="watch-history"></div>
        </div>
        <div class="panel-sec" id="proc-sec">
          <h4>进程</h4>
          <div id="proc-status"></div>
        </div>
      </div>
    </aside>
    <div id="resizer-left" class="resizer"></div>

    <!-- 中间：聊天 -->
    <section class="center">
      <header>
        <img class="avatar" id="head-avatar" src="/avatar.png" alt="🐋">
        <div>
          <h1>小鲸鱼</h1>
          <div class="status"><span class="dot" id="dot"></span><span id="status-text">……</span></div>
        </div>
        <div class="head-actions">
          <button id="theme-btn" class="icon-btn" title="深浅色">🌙</button>
          <button id="dev-btn" class="icon-btn hidden" title="思考后台">🧠</button>
        </div>
      </header>
      <main id="msgs"><div class="thread" id="thread"></div></main>
      <footer>
        <div class="inner">
          <button id="sticker-btn" class="icon-btn sticker-btn" title="表情包">🐋</button>
          <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
          <button id="send" class="send">发</button>
        </div>
      </footer>
      <div id="sticker-panel" class="sticker-panel hidden"></div>
    </section>
    <div id="resizer-right" class="resizer hidden"></div>

    <!-- 右栏：思考后台 -->
    <aside id="right" class="panel right hidden">
      <div class="panel-head"><span>🧠 思考后台</span><button id="dev-close" class="icon-btn" style="width:26px;height:26px;font-size:14px">×</button></div>
      <div id="dev-body" class="dev-body"><div class="dev-empty">说一句话后，这里会显示她的思考过程。</div></div>
    </aside>
  </div>

<script>
  const $ = (id) => document.getElementById(id)
  const msgs = $('thread')

  // —— 主题（Claude 深/浅）——
  const THEME_KEY = 'ww_theme'
  function applyTheme(t) {
    document.documentElement.dataset.theme = t
    $('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙'
  }
  function toggleTheme() {
    const t = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark'
    localStorage.setItem(THEME_KEY, t)
    applyTheme(t)
  }
  let savedTheme = 'light'
  try { savedTheme = localStorage.getItem(THEME_KEY) || 'light' } catch {}
  applyTheme(savedTheme)

  let devMode = false
  let identity = 'guest'

  function bubbleNode(role, text) {
    const row = document.createElement('div')
    row.className = 'row ' + role
    if (role === 'her') {
      const av = document.createElement('img')
      av.className = 'avatar'; av.src = '/avatar.png'; av.alt = '🐋'
      row.appendChild(av)
    }
    const b = document.createElement('div')
    b.className = 'bubble'; b.textContent = text
    row.appendChild(b)
    return row
  }

  function addBubble(role, text) {
    if (!text) return
    const row = bubbleNode(role, text)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
    return row
  }

  function addHerBubble(reply) {
    const row = document.createElement('div')
    row.className = 'row her'
    const av = document.createElement('img')
    av.className = 'avatar'; av.src = '/avatar.png'; av.alt = '🐋'
    row.appendChild(av)
    const b = document.createElement('div')
    b.className = 'bubble'
    if (reply.sticker && reply.sticker.hash) {
      const img = document.createElement('img')
      img.className = 'her-sticker'
      img.src = '/s/' + reply.sticker.hash + '.gif'
      img.alt = reply.sticker.name || '表情'
      b.appendChild(img)
    }
    if (reply.text) {
      const t = document.createElement('span')
      t.textContent = reply.text
      b.appendChild(t)
    }
    row.appendChild(b)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
    return row
  }

  function setThinking(on) {
    const old = document.querySelector('.typing')
    if (old) old.remove()
    $('head-avatar').classList.toggle('thinking', on)
    $('dot').classList.toggle('thinking', on)
    if (on) {
      $('status-text').textContent = '她正在想…'
      const row = document.createElement('div')
      row.className = 'row her'
      const av = document.createElement('img')
      av.className = 'avatar thinking'; av.src = '/avatar.png'; av.alt = '🐋'
      row.appendChild(av)
      const t = document.createElement('div')
      t.className = 'typing'; t.innerHTML = '<span class="dots">她正在想</span>'
      row.appendChild(t)
      msgs.appendChild(row)
      msgs.scrollTop = msgs.scrollHeight
    } else {
      pollStatus()
    }
  }

  function addError(text, msg) {
    const row = document.createElement('div')
    row.className = 'row her'
    const av = document.createElement('img')
    av.className = 'avatar'; av.src = '/avatar.png'; av.alt = '🐋'
    row.appendChild(av)
    const b = document.createElement('div')
    b.className = 'bubble'
    const s = document.createElement('span')
    s.textContent = msg + '　'
    b.appendChild(s)
    const btn = document.createElement('button')
    btn.className = 'retry'; btn.textContent = '重试'
    btn.onclick = () => { row.remove(); deliver(text) }
    b.appendChild(btn)
    row.appendChild(b)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
  }

  async function loadHistory() {
    try {
      const r = await fetch('/api/history?limit=60').then(r => r.json())
      const list = Array.isArray(r && r.messages) ? r.messages : []
      if (list.length) {
        for (const m of list) addBubble(m.role === 'assistant' ? 'her' : 'me', m.text)
      } else {
        addBubble('her', '你来了呀～我是小鲸鱼。🐋 今天过得怎么样？')
      }
    } catch {
      addBubble('her', '你来了呀～我是小鲸鱼。🐋 今天过得怎么样？')
    }
  }

  async function enterChat() {
    $('gate').classList.add('hidden')
    $('app').classList.remove('hidden')
    if (devMode) {
      $('app').classList.add('dev')
      $('dev-btn').classList.remove('hidden')
      $('right').classList.remove('hidden')
      $('resizer-right').classList.remove('hidden')
    }
    loadHistory()
    pollStatus()
    loadActivity()
  }

  async function pollStatus() {
    try {
      const r = await fetch('/api/status').then(r => r.json())
      $('dot').classList.remove('thinking')
      if (r && r.ok) {
        $('dot').classList.add('on')
        $('status-text').textContent = '在线 · 她在'
      } else {
        $('dot').classList.remove('on')
        $('status-text').textContent = '她这会儿不在'
      }
    } catch {
      $('dot').classList.remove('on')
      $('status-text').textContent = '连接不上'
    }
  }

  // —— 左栏：活动 ——
  function fmtDur(s) {
    s = Number(s) || 0
    const m = Math.floor(s / 60), ss = s % 60
    return m + ':' + String(ss).padStart(2, '0')
  }
  function watchItemEl(it, tag) {
    const w = document.createElement('div')
    w.className = 'watch-item'
    if (it.pic) {
      const img = document.createElement('img')
      img.className = 'watch-thumb'; img.src = it.pic; img.loading = 'lazy'; img.alt = ''
      w.appendChild(img)
    }
    const meta = document.createElement('div')
    meta.className = 'watch-meta'
    const t = document.createElement('a')
    t.className = 'watch-title'; t.href = 'https://www.bilibili.com/video/' + it.bvid; t.target = '_blank'; t.rel = 'noreferrer'; t.textContent = it.title || it.bvid
    meta.appendChild(t)
    const sub = document.createElement('div')
    sub.className = 'watch-sub'
    sub.textContent = (it.up ? it.up + ' · ' : '') + (it.duration ? fmtDur(it.duration) : '')
    if (tag) {
      const s = document.createElement('span')
      s.className = 'watch-tag'; s.textContent = tag
      sub.appendChild(s)
    }
    meta.appendChild(sub)
    w.appendChild(meta)
    return w
  }
  async function loadActivity() {
    try {
      const r = await fetch('/api/activity').then(r => r.json())
      const q = $('watch-queue'), h = $('watch-history'), p = $('proc-status')
      // 待看队列（主人可见）
      $('watch-queue-sec').classList.toggle('hidden', !devMode)
      q.innerHTML = ''
      const queue = Array.isArray(r.queue) ? r.queue : []
      if (queue.length) for (const it of queue) q.appendChild(watchItemEl(it, it.status === 'queued' ? '待看' : '已看'))
      else q.innerHTML = '<div class="empty">还没有排队。</div>'
      // 加视频表单（主人）
      const wf = $('watch-form-wrap')
      wf.innerHTML = ''
      if (devMode) {
        const form = document.createElement('div')
        form.id = 'watch-form'
        const input = document.createElement('input')
        input.id = 'watch-input'; input.placeholder = 'BV 号，如 BV1St4Y6jEkc'
        const add = document.createElement('button')
        add.id = 'watch-add'; add.textContent = '加'
        add.onclick = addWatch
        form.appendChild(input); form.appendChild(add)
        wf.appendChild(form)
      }
      // 最近看的
      h.innerHTML = ''
      const history = Array.isArray(r.history) ? r.history : []
      if (history.length) for (const it of history) h.appendChild(watchItemEl(it))
      else h.innerHTML = '<div class="empty">她还没看多少。</div>'
      // 进程
      $('proc-sec').classList.toggle('hidden', !devMode)
      const st = (r && r.status) || {}
      const rows = [
        ['桌宠在线', st.presence?.online ? '在线' : '离线'],
        ['对话', st.chat?.enabled ? '开启' : '关闭'],
        ['模型', st.llm?.ready ? (st.llm.model || '已就绪') : '未就绪'],
        ['语音', st.voice?.enabled ? (st.voice.route || '开') : '关'],
        ['专注模式', st.focus?.enabled ? '开' : '关'],
      ]
      p.innerHTML = ''
      for (const [k, v] of rows) {
        const row = document.createElement('div')
        row.className = 'proc-row'
        row.innerHTML = '<span class="k">' + k + '</span><span class="v">' + v + '</span>'
        p.appendChild(row)
      }
    } catch {}
  }
  async function addWatch() {
    const input = $('watch-input')
    const bvid = (input.value || '').trim()
    if (!bvid) return
    input.disabled = true; $('watch-add').disabled = true
    try {
      const r = await fetch('/api/watch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ bvid }) }).then(r => r.json())
      if (r && r.ok) { input.value = ''; loadActivity() } else { alert((r && r.error) || '加不进') }
    } catch { alert('网络出错') }
    finally { input.disabled = false; $('watch-add').disabled = false }
  }

  // —— 思考后台 ——
  function showDebug(d, r) {
    const body = $('dev-body')
    body.innerHTML = ''
    const kv = document.createElement('div')
    kv.className = 'dev-kv'
    let usageTxt = '-'
    if (d.usage) {
      const u = d.usage
      const inT = u.inputTokens ?? u.promptTokens ?? u.input_tokens ?? u.prompt_tokens
      const outT = u.outputTokens ?? u.completionTokens ?? u.output_tokens ?? u.completion_tokens
      if (inT != null || outT != null) usageTxt = '入 ' + (inT ?? '?') + ' / 出 ' + (outT ?? '?')
      else usageTxt = JSON.stringify(u)
    }
    const items = [
      '身份：' + (d.identity === 'guest' ? '访客' : '主人'),
      '亲密度：' + d.intimacy,
      '模型：' + (d.model || '-'),
      '耗时：' + (d.latencyMs != null ? d.latencyMs + 'ms' : '-'),
      'token：' + usageTxt,
      '表情：' + (d.stickerRef || '无'),
      '记忆写入：' + (r.remembered != null ? r.remembered : '-'),
    ]
    for (const it of items) {
      const s = document.createElement('span')
      s.textContent = it
      kv.appendChild(s)
    }
    body.appendChild(kv)
    const addSection = (title, content) => {
      const h = document.createElement('h4')
      h.textContent = title
      body.appendChild(h)
      const pre = document.createElement('pre')
      pre.textContent = content || '（空）'
      body.appendChild(pre)
    }
    addSection('系统提示词', d.system)
    addSection('发给模型', d.user)
    addSection('原始回复', d.raw)
    addSection('记忆块', d.memory)
    if (d.purpose) addSection('目的状态', JSON.stringify(d.purpose, null, 1))
  }

  async function deliver(text) {
    setThinking(true)
    $('send').disabled = true
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }).then(r => r.json())
      setThinking(false)
      if (r && r.ok && r.reply) {
        addHerBubble(r.reply)
        if (devMode && r.debug) showDebug(r.debug, r)
      } else {
        addError(text, (r && r.error) || '她好像走神了')
      }
    } catch {
      setThinking(false)
      addError(text, '连不上了')
    } finally {
      $('send').disabled = false
    }
  }

  // —— 表情包 ——
  let stickers = []
  async function loadStickers() {
    try {
      const r = await fetch('/api/stickers').then(r => r.json())
      stickers = Array.isArray(r && r.stickers) ? r.stickers : []
      const panel = $('sticker-panel')
      panel.innerHTML = ''
      for (const s of stickers) {
        const img = document.createElement('img')
        img.className = 'st'; img.src = '/s/' + s.hash + '.gif'; img.alt = s.id; img.loading = 'lazy'; img.title = s.id
        img.onclick = () => sendSticker(s)
        panel.appendChild(img)
      }
    } catch {}
  }
  function stickerText(s) {
    const name = (s.name || s.id || '').trim()
    const emo = (s.emotion || '').trim()
    const desc = (s.desc || '').trim()
    const text = (s.text || '').trim()
    let out = '[表情' + (name ? '：' + name : '') + (emo ? '（' + emo + '）' : '') + ']'
    if (desc) out += ' ' + desc
    if (text) out += '（图上有字：' + text + '）'
    return out
  }
  function sendSticker(s) {
    $('sticker-panel').classList.add('hidden')
    const row = document.createElement('div')
    row.className = 'row me'
    const b = document.createElement('div')
    b.className = 'bubble img'
    const img = document.createElement('img')
    img.src = '/s/' + s.hash + '.gif'; img.alt = s.id
    b.appendChild(img)
    row.appendChild(b)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
    const say = stickerText(s)
    if (say) deliver(say)
  }

  async function init() {
    try {
      const r = await fetch('/api/auth').then(r => r.json())
      if (r && r.authorized) {
        devMode = !!(r && r.dev)
        identity = (r && r.identity) || 'guest'
        enterChat()
      } else { $('gate').classList.remove('hidden') }
    } catch { $('gate').classList.remove('hidden') }
  }

  $('enter').onclick = async () => {
    const code = $('invite').value.trim()
    if (!code) return
    try {
      const r = await fetch('/api/invite', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code }) }).then(r => r.json())
      if (r && r.ok) { location.reload() } else { $('gate-err').textContent = (r && r.error) || '邀请码不对' }
    } catch { $('gate-err').textContent = '网络出错，稍后再试' }
  }
  $('invite').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click() })

  $('send').onclick = () => {
    const input = $('input')
    const text = input.value.trim()
    if (!text) return
    input.value = ''; input.style.height = 'auto'
    addBubble('me', text)
    deliver(text)
  }
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click() }
  })
  $('input').addEventListener('input', () => {
    $('input').style.height = 'auto'
    $('input').style.height = Math.min($('input').scrollHeight, 140) + 'px'
  })

  $('sticker-btn').onclick = () => {
    const panel = $('sticker-panel')
    panel.classList.toggle('hidden')
    if (!stickers.length) loadStickers()
  }

  $('theme-btn').onclick = toggleTheme
  $('dev-btn').onclick = () => $('right').classList.toggle('hidden')
  $('dev-close').onclick = () => $('right').classList.add('hidden')

  // —— 两侧侧屏拖拽调宽（记忆到 localStorage）——
  function initResizer(handle, side) {
    if (!handle) return
    const key = side === 'left' ? 'ww_left_w' : 'ww_right_w'
    const prop = side === 'left' ? '--left-w' : '--right-w'
    let dragging = false
    try {
      const saved = Number(localStorage.getItem(key))
      if (saved) document.documentElement.style.setProperty(prop, Math.min(520, Math.max(160, saved)) + 'px')
    } catch {}
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault()
      dragging = true
      handle.classList.add('active')
      document.body.style.userSelect = 'none'
    })
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return
      const v = side === 'left' ? e.clientX : (window.innerWidth - e.clientX)
      document.documentElement.style.setProperty(prop, Math.min(520, Math.max(160, v)) + 'px')
    })
    window.addEventListener('mouseup', () => {
      if (!dragging) return
      dragging = false
      handle.classList.remove('active')
      document.body.style.userSelect = ''
      const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(prop)) || 0
      try { if (w) localStorage.setItem(key, String(Math.round(w))) } catch {}
    })
  }
  initResizer($('resizer-left'), 'left')
  initResizer($('resizer-right'), 'right')

  init()
</script>
</body>
